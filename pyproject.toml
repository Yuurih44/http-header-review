[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "http-header-review"
version = "0.2.0"
description = "Revisão offline de cabeçalhos HTTP com verificações explícitas e limites documentados."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yuri Siqueira Alves" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.14.3"]

[project.scripts]
http-header-review = "audit:main"

[project.urls]
Repository = "https://github.com/Yuurih44/http-header-review"
Issues = "https://github.com/Yuurih44/http-header-review/issues"

[tool.setuptools]
py-modules = ["audit"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
